<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cash Shalom · KAZYE</title>
    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <!-- Apple touch icon pour iOS -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#001f33">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* thème bleu électrique / blanc / noir /vert */
        :root {
            --bg-main: #0a1a24;
            --surface: #112b38;
            --card-bg: #eef5fa;
            --electric-blue: #0066ff;
            --electric-glow: #0055dd;
            --text-light: #ffffff;
            --text-dark: #11181f;
            --paid-green: #00cc66;
            --paid-green-dark: #00994d;
            --border-soft: #c0d4e6;
            --shadow: rgba(0,102,255,0.2);
            --header-bg: #001f33;
            --calc-bg: #001a29;
            --btn-active: #0044aa;
        }

        body {
            background: var(--bg-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 0;
            color: var(--text-dark);
        }

        .app {
            width: 100%;
            max-width: 520px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,153,255,0.3);
            border-left: 2px solid var(--electric-blue);
            border-right: 2px solid var(--electric-blue);
        }

        /* HEADER BLEU ÉLECTRIQUE */
        .cash-header {
            background: var(--header-bg);
            padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 8px 12px;
            color: white;
            border-bottom: 3px solid var(--electric-blue);
            position: sticky;
            top: 0;
            z-index: 30;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .cash-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: white;
            text-shadow: 2px 2px 0 #000033;
        }

        .badge {
            background: var(--electric-blue);
            color: white;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            border: 1px solid white;
        }

        .header-controls {
            display: flex;
            gap: 6px;
        }
        .icon-btn {
            background: #003d66;
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            font-size: 24px;
            display: flex;
                align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--electric-blue);
            box-shadow: 0 3px 0 #001a33;
        }
        .icon-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        /* --- NOUVEAU: BAR TOTAL KAZYE ANLÈ (PI VIZIB) --- */
        .total-kazye-bar {
            background: #004488;
            border-radius: 50px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid var(--electric-blue);
            margin: 8px 0 12px 0;
            box-shadow: 0 0 15px rgba(0,102,255,0.5);
        }
        .total-label {
            color: white;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .total-value {
            font-size: 28px;
            font-weight: 800;
            color: #80d4ff;
            line-height: 1;
            background: #002b44;
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid var(--electric-blue);
        }
        .total-currency {
            color: #b3d9ff;
            margin-left: 4px;
            font-size: 18px;
        }
        .count-badge {
            background: #00cc66;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
        }
        /* --- FIN BAR TOTAL KAZYE --- */

        .balans-sticky {
            background: #002b44;
            border-radius: 50px;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--electric-blue);
            margin-top: 4px;
        }
        .balans-label { color: #9fc9ff; font-weight: 600; font-size: 16px; }
        .balans-value { font-size: 32px; font-weight: 800; color: white; line-height: 1; }
        .balans-currency { color: #b3d9ff; margin-left: 5px; font-size: 18px; }

        /* CARTES plus compactes */
        .card {
            background: var(--card-bg);
            margin: 8px 12px;
            padding: 14px 12px;
            border-radius: 24px;
            box-shadow: 0 4px 12px rgba(0,51,102,0.2);
            border: 1px solid var(--electric-blue);
        }

        .section-title {
            color: #003d66;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* PLAN SCROLL plus fin */
        .plan-scroll {
            overflow-x: auto;
            padding: 2px 0 8px 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            white-space: nowrap;
        }
        .plan-btns { display: inline-flex; gap: 6px; }
        .plan-item {
            background: white;
            border: 2px solid var(--electric-blue);
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 700;
            color: #003366;
            font-size: 15px;
            box-shadow: 0 3px 0 #99c2ff;
            cursor: pointer;
        }
        .plan-item.active {
            background: var(--electric-blue);
            color: white;
            box-shadow: 0 3px 0 #003d99;
        }

        /* MODE TOGGLE compact */
        .mode-group {
            background: white;
            border-radius: 60px;
            padding: 3px;
            display: flex;
            border: 2px solid var(--electric-blue);
            margin-bottom: 12px;
        }
        .mode-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 60px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            background: transparent;
            color: #003d66;
        }
        .mode-btn.active {
            background: var(--electric-blue);
            color: white;
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--electric-blue);
            border-radius: 60px;
            font-size: 16px;
            background: white;
        }
        .btn-action {
            background: var(--electric-blue);
            border: none;
            color: white;
            font-weight: 800;
            padding: 14px 18px;
            border-radius: 60px;
            font-size: 18px;
            box-shadow: 0 4px 0 #003d99;
            cursor: pointer;
        }
        .btn-action.retrait {
            background: #11181f;
            box-shadow: 0 4px 0 #000000;
        }

        /* GRILLE KAZYE - VERT quand sélectionné */
        .kazye-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin: 8px 0;
        }
        .kaz {
            background: white;
            border: 2px solid var(--electric-blue);
            border-radius: 16px;
            padding: 8px 2px;
            text-align: center;
            font-weight: 700;
            color: #002b44;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 3px 0 #b3d9ff;
        }
        .kaz small {
            font-size: 10px;
            font-weight: 600;
            display: block;
            color: #336699;
        }
        .kaz.paid {
            background: #00cc66;
            border-color: #008040;
            color: white;
            box-shadow: 0 3px 0 #00994d;
        }
        .kaz.paid small { color: #e6ffe6; }

        .paid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0 6px;
        }
        .paid-total {
            background: #11181f;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
        }
        .btn-clear {
            background: #001f33;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 600;
            border: 1px solid var(--electric-blue);
        }

        /* RESULT CARD (noir/bleu) */
        .result-card {
            background: #001a29;
            margin: 8px 12px 12px 12px;
            padding: 16px;
            border-radius: 28px;
            color: white;
            border: 2px solid var(--electric-blue);
        }
        .final-balance-large {
            font-size: 40px;
            font-weight: 800;
            color: #80d4ff;
        }
        .auto-list-mobile {
            background: #003355;
            padding: 12px;
            border-radius: 20px;
            margin-top: 12px;
            font-weight: 600;
        }
        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }
        .chip {
            background: #004477;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
        }

        .footer-actions {
            display: flex;
            gap: 10px;
            margin: 4px 12px 16px;
        }
        .btn-footer {
            flex: 1;
            background: #001f33;
            border: 2px solid var(--electric-blue);
            color: white;
            padding: 12px 0;
            border-radius: 40px;
            font-weight: 600;
        }

        .footer-shalom {
            text-align: center;
            color: #99ccff;
            font-weight: 600;
            padding: 8px 8px 16px;
        }

        /* MODAL CALCULATRICE PLEIN ÉCRAN */
        .calc-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a1a29;
            z-index: 200;
            padding: 8px;
            overflow-y: auto;
        }
        .calc-modal.active { display: block; }
        
        .calc-container {
            background: #0a1a29;
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            padding: 8px 0;
        }
        
        .calc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #001a33;
            border-radius: 20px;
            padding: 8px 16px;
            margin: 4px 8px 12px 8px;
            color: white;
            border: 2px solid #0066ff;
        }
        .calc-header-left {
            display: flex;
            gap: 16px;
            font-weight: 600;
        }
        .calc-header-left span {
            color: #99ccff;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
        }
        .calc-header-left span.active {
            background: #0066ff;
            color: white;
        }
        .calc-header-right {
            display: flex;
            gap: 12px;
        }
        .calc-header-right span {
            background: #004488;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
        }
        
        .calc-display {
            background: #000f1a;
            color: #80d4ff;
            font-size: 48px;
            font-weight: 700;
            text-align: right;
            padding: 20px 16px;
            border-radius: 20px;
            margin: 0 8px 16px 8px;
            border: 2px solid #0066ff;
            font-family: 'Courier New', monospace;
            min-height: 100px;
            word-break: break-all;
        }
        
        /* Lignes scientifiques */
        .calc-scientific-row {
            display: flex;
            gap: 6px;
            margin: 0 8px 6px 8px;
        }
        .calc-sci-btn {
            background: #003366;
            border: 2px solid #3399ff;
            color: white;
            font-size: 18px;
            font-weight: 600;
            padding: 16px 0;
            border-radius: 30px;
            flex: 1;
            text-align: center;
            box-shadow: 0 4px 0 #001a33;
            cursor: pointer;
        }
        .calc-sci-btn.special {
            background: #004488;
        }
        
        /* Grille principale */
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin: 8px 8px 12px 8px;
        }
        .calc-btn {
            background: #004488;
            border: none;
            color: white;
            font-size: 26px;
            font-weight: 600;
            padding: 20px 0;
            border-radius: 20px;
            box-shadow: 0 5px 0 #002244;
            cursor: pointer;
            text-align: center;
            border: 1px solid #66aaff;
        }
        .calc-btn.operator {
            background: #0066ff;
        }
        .calc-btn.equals {
            background: #00aa66;
            grid-column: 1 / -1;
        }
        .calc-btn.del {
            background: #cc6600;
            font-size: 24px;
        }
        .calc-btn.clear {
            background: #cc3300;
        }
        .calc-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }
        
        .calc-close {
            background: #0066ff;
            border: none;
            color: white;
            font-size: 22px;
            font-weight: 700;
            padding: 18px;
            border-radius: 50px;
            margin: 8px 8px 20px 8px;
            width: calc(100% - 16px);
            cursor: pointer;
            border: 2px solid white;
        }
        button { cursor: pointer; }
        button:focus-visible, .input-field:focus-visible { outline: 3px solid #80d4ff; outline-offset: 2px; }
        .plan-scroll::-webkit-scrollbar { display: none; }
        body, .app { min-height: 100dvh; }

        /* HISTORIQUE & SAUVEGARDE */
        .btn-footer.warn { border-color: #ffb020; }
        .hist-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a1a29; z-index: 210; overflow-y: auto;
            padding: calc(8px + env(safe-area-inset-top, 0px)) 8px calc(8px + env(safe-area-inset-bottom, 0px));
        }
        .hist-modal.active { display: block; }
        .hist-container { max-width: 520px; margin: 0 auto; color: white; display: flex; flex-direction: column; gap: 10px; }
        .hist-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 18px; }
        .hist-head button { background: #004488; color: white; border: 2px solid var(--electric-blue); border-radius: 40px; width: 44px; height: 44px; font-size: 18px; }
        .hist-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .hist-summary div { background: #001f33; border: 1px solid var(--electric-blue); border-radius: 16px; padding: 8px 12px; display: flex; flex-direction: column; font-size: 12px; color: #9fc9ff; }
        .hist-summary b { font-size: 18px; color: white; }
        .hist-actions { display: flex; gap: 8px; }
        .hist-actions button { flex: 1; background: #001f33; border: 2px solid var(--electric-blue); color: white; padding: 12px 0; border-radius: 40px; font-weight: 600; }
        .hist-note { font-size: 12px; color: #9fc9ff; }
        .hist-list { display: flex; flex-direction: column; gap: 6px; }
        .hist-row { display: flex; justify-content: space-between; gap: 8px; background: #112b38; border-radius: 14px; padding: 8px 12px; font-size: 13px; }
        .hist-row small { display: block; color: #9fc9ff; font-size: 11px; }
        .hist-row .h-r { text-align: right; }
        .h-plus { color: #00e676; font-weight: 700; }
        .h-minus { color: #ff6b6b; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app">
        <!-- HEADER avec bouton calculatrice -->
        <div class="cash-header">
            <div class="header-row">
                <span class="cash-title">⚡CASH SHALOM</span>
                <div class="header-controls">
                    <button class="icon-btn" id="calcToggle" aria-label="Kalkilatris">🧮</button>
                    <span class="badge">✡️</span>
                </div>
            </div>
            
            <!-- --- NOUVEAU: BAR TOTAL KAZYE ANLÈ --- -->
            <div class="total-kazye-bar">
                <div class="total-label">
                    <span>📊 TOTAL KAZYE SELÈKSYONNE</span>
                    <span class="count-badge" id="selectedCountHeader">0</span>
                </div>
                <div>
                    <span class="total-value" id="selectedTotalHeader">0.00</span>
                    <span class="total-currency">$</span>
                </div>
            </div>
            <!-- --- FIN BAR TOTAL KAZYE --- -->
            
            <div class="balans-sticky">
                <span class="balans-label">BALANS</span>
                <div style="display: flex; align-items: baseline;">
                    <span class="balans-value" id="balansDisplay">0.00</span>
                    <span class="balans-currency">$</span>
                </div>
            </div>
        </div>

        <!-- PLAN carte -->
        <div class="card">
            <div class="section-title">📋 PLAN (pri = nimewo × plan)</div>
            <div class="plan-scroll">
                <div class="plan-btns" id="planButtons"></div>
            </div>
        </div>

        <!-- DEPO/RETRAIT carte -->
        <div class="card">
            <div class="mode-group" id="modeGroup">
                <button id="modeDepot" class="mode-btn active">💵 DEPO</button>
                <button id="modeRetrait" class="mode-btn">💰 RETRÈ</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <input type="number" id="montantField" class="input-field" placeholder="Montan $" min="0" step="any" inputmode="decimal">
                <button class="btn-action" id="actionButton">🧮 KALKILE</button>
            </div>
        </div>

        <!-- KAZYE carte -->
        <div class="card">
            <div class="paid-header">
                <span class="paid-total" id="totalPaidDisplay">0.00$</span>
                <button class="btn-clear" id="clearPaidBtn">🗑️ Efase</button>
            </div>
            <p style="color:#0066cc; font-size:13px; margin:4px 0;">▼ klike sou kaz vèt si peye</p>
            <div class="kazye-grid" id="kazyeGrid"></div>
        </div>

        <!-- REZILTA CARD -->
        <div class="result-card">
            <div style="display: flex; justify-content: space-between;">
                <span>BALANS FINAL</span>
                <span class="final-balance-large" id="finalBalance">0.00</span>
            </div>
            <div class="auto-list-mobile" id="autoList">—</div>
            <div class="chip-group">
                <span class="chip">📌 PLAN: <span id="planLabel">5$</span></span>
                <span class="chip">📆 DÈNYE: <span id="lastPaidLabel">0</span></span>
                <span class="chip">🆕 DISPONIB: <span id="availableStartLabel">1</span></span>
            </div>
        </div>

        <!-- BOUTON FÒTER -->
        <div class="footer-actions">
            <button class="btn-footer" id="verifyBtn">✅ Verifye</button>
            <button class="btn-footer" id="resetBalanceBtn">🔄 Reset balans</button>
        </div>
        <div class="footer-actions">
            <button class="btn-footer" id="histBtn">📜 Istorik &amp; Sovgad</button>
        </div>
        <div class="footer-shalom">✡️ SHALOM · BLEU ÉLECTRIQUE ✡️</div>
    </div>

    <!-- MODAL CALCULATRICE PLEIN ÉCRAN -->
    <div class="calc-modal" id="calcModal">
        <div class="calc-container">
            <div class="calc-header">
                <div class="calc-header-left">
                    <span class="active" id="angDeg" onclick="calcSetAngle('DEG')">DEG</span>
                    <span id="angRad" onclick="calcSetAngle('RAD')">RAD</span>
                </div>
            </div>
            
            <div class="calc-display" id="calcDisplay">0</div>
            
            <!-- Lignes scientifiques -->
            <div class="calc-scientific-row">
                <button class="calc-sci-btn" onclick="calcInput('%')">%</button>
                <button class="calc-sci-btn" onclick="calcFn('ln')">ln</button>
                <button class="calc-sci-btn" onclick="calcFn('log')">log</button>
                <button class="calc-sci-btn" onclick="calcFn('sqrt')">√</button>
                <button class="calc-sci-btn" onclick="calcInput('^')">^</button>
            </div>
            <div class="calc-scientific-row">
                <button class="calc-sci-btn special" onclick="calcInput('π')">π</button>
                <button class="calc-sci-btn special" onclick="calcInput('e')">e</button>
                <button class="calc-sci-btn" onclick="calcInput('(')">(</button>
                <button class="calc-sci-btn" onclick="calcInput(')')">)</button>
                <button class="calc-sci-btn" onclick="calcFn('fact')">!</button>
            </div>
            
            <!-- Grille principale avec boutons C et ← -->
            <div class="calc-buttons">
                <button class="calc-btn" onclick="calcInput('7')">7</button>
                <button class="calc-btn" onclick="calcInput('8')">8</button>
                <button class="calc-btn" onclick="calcInput('9')">9</button>
                <button class="calc-btn operator" onclick="calcOp('/')">÷</button>
                <button class="calc-btn operator" onclick="calcFn('sin')">sin</button>
                
                <button class="calc-btn" onclick="calcInput('4')">4</button>
                <button class="calc-btn" onclick="calcInput('5')">5</button>
                <button class="calc-btn" onclick="calcInput('6')">6</button>
                <button class="calc-btn operator" onclick="calcOp('*')">×</button>
                <button class="calc-btn operator" onclick="calcFn('cos')">cos</button>
                
                <button class="calc-btn" onclick="calcInput('1')">1</button>
                <button class="calc-btn" onclick="calcInput('2')">2</button>
                <button class="calc-btn" onclick="calcInput('3')">3</button>
                <button class="calc-btn operator" onclick="calcOp('-')">−</button>
                <button class="calc-btn operator" onclick="calcFn('tan')">tan</button>
                
                <button class="calc-btn" onclick="calcInput('0')">0</button>
                <button class="calc-btn" onclick="calcInput('.')">.</button>
                <button class="calc-btn clear" onclick="calcClearAll()">C</button>
                <button class="calc-btn operator" onclick="calcOp('+')">+</button>
                <button class="calc-btn del" onclick="calcDelete()">←</button>
                
                <!-- Bouton = sur deux colonnes -->
                <button class="calc-btn equals" onclick="calcEquals()">=</button>
            </div>
            
            <button class="calc-close" id="closeCalc">Fèmen</button>
        </div>
    </div>

    <!-- MODAL HISTORIQUE & SAUVEGARDE -->
    <div class="hist-modal" id="histModal">
        <div class="hist-container">
            <div class="hist-head">
                <span>📜 ISTORIK &amp; SOVGAD</span>
                <button id="closeHist" aria-label="Fèmen">✕</button>
            </div>
            <div class="hist-summary" id="histSummary"></div>
            <div class="hist-actions">
                <button id="exportBtn">💾 Ekspòte</button>
                <button id="importBtn">📥 Enpòte</button>
                <input type="file" id="importFile" accept="application/json,.json" hidden>
            </div>
            <p class="hist-note" id="lastBackupLabel"></p>
            <div class="hist-list" id="histList"></div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- ÉTAT PRINCIPAL ----------
            let balans = 0;
            let plan = 5;
            const PLAN_LIST = [1,2,3,4,5,10,15,20,50];
            let paidAmt = new Array(31).fill(0);   // montant RÉELLEMENT payé par case (0 = case libre)
            let ledger = [];                        // journal des mouvements = source de vérité
            let lastBackup = null;                  // date ISO de la dernière sauvegarde exportée
            let mode = 'depot';

            // ---------- CONSTANTES ----------
            const STORAGE_KEY = 'cashShalomData';
            const DATA_VERSION = 2;
            const LEDGER_TYPES = ['init','depot','retrait','kazye','anile','efase','reset'];
            const SIGN = { init: 1, depot: 1, anile: 1, efase: 1, retrait: -1, kazye: -1, reset: -1 };
            const r2 = x => Math.round(x * 100) / 100;
            const fmt = x => String(+Number(x).toFixed(2));
            const near = (a, b) => Math.abs(a - b) < 0.005;
            const isPaid = k => paidAmt[k] > 0;
            const sumPaid = () => r2(paidAmt.reduce((a, b) => a + b, 0));

            // DOM principal
            const balansDisplay = document.getElementById('balansDisplay');
            const planButtons = document.getElementById('planButtons');
            const kazyeGrid = document.getElementById('kazyeGrid');
            const totalPaidDisplay = document.getElementById('totalPaidDisplay');
            const modeDepot = document.getElementById('modeDepot');
            const modeRetrait = document.getElementById('modeRetrait');
            const actionButton = document.getElementById('actionButton');
            const montantField = document.getElementById('montantField');
            const finalBalance = document.getElementById('finalBalance');
            const autoList = document.getElementById('autoList');
            const planLabel = document.getElementById('planLabel');
            const lastPaidLabel = document.getElementById('lastPaidLabel');
            const availableStartLabel = document.getElementById('availableStartLabel');
            const clearPaidBtn = document.getElementById('clearPaidBtn');
            const verifyBtn = document.getElementById('verifyBtn');
            const resetBalanceBtn = document.getElementById('resetBalanceBtn');
            const calcToggle = document.getElementById('calcToggle');
            const calcModal = document.getElementById('calcModal');
            const closeCalc = document.getElementById('closeCalc');
            const selectedTotalHeader = document.getElementById('selectedTotalHeader');
            const selectedCountHeader = document.getElementById('selectedCountHeader');
            // Historique & sauvegarde
            const histBtn = document.getElementById('histBtn');
            const histModal = document.getElementById('histModal');
            const closeHist = document.getElementById('closeHist');
            const histSummary = document.getElementById('histSummary');
            const histList = document.getElementById('histList');
            const lastBackupLabel = document.getElementById('lastBackupLabel');
            const exportBtn = document.getElementById('exportBtn');
            const importBtn = document.getElementById('importBtn');
            const importFile = document.getElementById('importFile');

            // ---------- JOURNAL (LEDGER) ----------
            // Effet sur le balans : init/depot/anile/efase = +, retrait/kazye/reset = −
            function log(type, extra) {
                ledger.push(Object.assign({ t: new Date().toISOString(), type: type }, extra));
            }

            // Rejoue le journal : renvoie le balans et les montants par case qu'il implique
            function replay(list) {
                let b = 0;
                const pa = new Array(31).fill(0);
                list.forEach(e => {
                    b = r2(b + SIGN[e.type] * e.amount);
                    if (e.type === 'kazye') pa[e.k] = e.amount;
                    else if (e.type === 'anile') pa[e.k] = 0;
                    else if (e.type === 'efase') pa.fill(0);
                });
                return { balans: b, paidAmt: pa };
            }

            function cleanEntry(e) {
                if (!e || typeof e !== 'object' || !LEDGER_TYPES.includes(e.type)) return null;
                const amount = Number(e.amount);
                if (!isFinite(amount) || amount < 0 || typeof e.t !== 'string') return null;
                const out = { t: e.t, type: e.type, amount: r2(amount) };
                if (e.type === 'kazye' || e.type === 'anile') {
                    if (!Number.isInteger(e.k) || e.k < 1 || e.k > 30) return null;
                    out.k = e.k;
                    if (PLAN_LIST.includes(e.plan)) out.plan = e.plan;
                    if (e.auto === true) out.auto = true;
                }
                return out;
            }

            // Journal de départ pour des données sans historique (ancienne version)
            function initLedger(b, pa) {
                const list = [];
                const now = new Date().toISOString();
                const total = r2(b + pa.reduce((x, y) => x + y, 0));
                if (total > 0) list.push({ t: now, type: 'init', amount: total });
                for (let k = 1; k <= 30; k++) if (pa[k] > 0) list.push({ t: now, type: 'kazye', k: k, amount: pa[k] });
                return list;
            }

            // Valide des données brutes (localStorage ou fichier importé), v1 et v2
            function normalize(d) {
                if (!d || typeof d !== 'object') return null;
                const b = Number(d.balans);
                const s = {
                    balans: (isFinite(b) && b >= 0) ? r2(b) : 0,
                    plan: PLAN_LIST.includes(d.plan) ? d.plan : 5,
                    mode: d.mode === 'retrait' ? 'retrait' : 'depot',
                    paidAmt: new Array(31).fill(0),
                    lastBackup: (typeof d.lastBackup === 'string' && !isNaN(Date.parse(d.lastBackup))) ? d.lastBackup : null
                };
                if (Array.isArray(d.paidAmt)) {
                    for (let i = 1; i <= 30; i++) { const v = Number(d.paidAmt[i]); s.paidAmt[i] = (isFinite(v) && v > 0) ? r2(v) : 0; }
                } else if (Array.isArray(d.paid)) {           // v1 : on suppose le plan enregistré
                    for (let i = 1; i <= 30; i++) s.paidAmt[i] = d.paid[i] === true ? r2(i * s.plan) : 0;
                }
                const raw = Array.isArray(d.ledger) ? d.ledger : null;
                let clean = raw ? raw.map(cleanEntry) : null;
                if (!raw || clean.some(e => e === null)) clean = initLedger(s.balans, s.paidAmt);
                s.ledger = clean;
                return s;
            }

            function applyState(s) {
                balans = s.balans; plan = s.plan; mode = s.mode;
                paidAmt = s.paidAmt; ledger = s.ledger; lastBackup = s.lastBackup;
            }

            // ---------- SAUVEGARDE LOCALE ----------
            let saveWarned = false;
            function snapshot() {
                return {
                    v: DATA_VERSION,
                    balans: balans,
                    plan: plan,
                    paid: paidAmt.map(v => v > 0),      // gardé pour compatibilité avec l'ancienne version
                    paidAmt: paidAmt,
                    mode: mode,
                    ledger: ledger,
                    lastBackup: lastBackup,
                    lastUpdated: new Date().toISOString()
                };
            }
            function saveData() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot()));
                } catch (e) {
                    console.error('Erreur de sauvegarde:', e);
                    if (!saveWarned) { saveWarned = true; alert('⚠️ Pa ka sove done yo nan aparèy la. Fè yon sovgad (Istorik & Sovgad).'); }
                }
            }
            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return;
                    const s = normalize(JSON.parse(raw));
                    if (s) applyState(s);
                } catch (e) {
                    console.error('Erreur de chargement:', e);
                }
            }

            // ---------- AFFICHAGE ----------
            function updateBalansUI() {
                balansDisplay.innerText = balans.toFixed(2);
                finalBalance.innerText = balans.toFixed(2);
            }

            function updateHeaderTotal() {
                let count = 0;
                for (let i = 1; i <= 30; i++) if (isPaid(i)) count++;
                selectedTotalHeader.innerText = sumPaid().toFixed(2);
                selectedCountHeader.innerText = count;
            }

            function updateTotalPaidAndLabels() {
                let last = 0, first = '—';
                for (let i = 1; i <= 30; i++) if (isPaid(i)) last = i;
                for (let i = 1; i <= 30; i++) if (!isPaid(i)) { first = i; break; }
                totalPaidDisplay.innerText = sumPaid().toFixed(2) + '$';
                lastPaidLabel.innerText = last;
                availableStartLabel.innerText = first;
            }

            function renderKazyeGrid() {
                let html = '';
                for (let i = 1; i <= 30; i++) {
                    const p = isPaid(i);
                    html += `<div class="kaz ${p ? 'paid' : ''}" data-kazye="${i}" onclick="window.togglePaid(${i})">
                        ${i}<br><small>${fmt(p ? paidAmt[i] : i * plan)}$</small>
                    </div>`;
                }
                kazyeGrid.innerHTML = html;
            }

            function updateBackupWarn() {
                const old = !lastBackup || (Date.now() - new Date(lastBackup).getTime()) > 7 * 864e5;
                histBtn.classList.toggle('warn', ledger.length > 0 && old);
            }

            function refreshAll() {
                updateBalansUI();
                renderKazyeGrid();
                updateTotalPaidAndLabels();
                updateHeaderTotal();
                updateBackupWarn();
                if (histModal.classList.contains('active')) renderHistory();
            }

            function buildPlanButtons() {
                planButtons.innerHTML = '';
                PLAN_LIST.forEach(p => {
                    const btn = document.createElement('button');
                    btn.innerText = `${p}$`;
                    btn.className = 'plan-item';
                    if (p === plan) btn.classList.add('active');
                    btn.onclick = () => {
                        // Le plan ne touche que les cases libres : les cases payées gardent leur montant réel
                        document.querySelectorAll('.plan-item').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        plan = p;
                        planLabel.innerText = `${plan}$`;
                        renderKazyeGrid();
                        saveData();
                    };
                    planButtons.appendChild(btn);
                });
            }

            // ---------- ACTIONS ----------
            // Clic sur une case : payer (depuis le balans) ou annuler (remboursement au balans)
            window.togglePaid = function(k) {
                if (isPaid(k)) {
                    const amt = paidAmt[k];
                    if (!confirm(`Anile kazye ${k}? ${fmt(amt)}$ ap tounen nan balans lan.`)) return;
                    balans = r2(balans + amt);
                    paidAmt[k] = 0;
                    log('anile', { k: k, amount: amt });
                    autoList.innerText = `Kazye ${k} anile`;
                } else {
                    const price = r2(k * plan);
                    if (price > balans) {
                        const manke = r2(price - balans);
                        if (!confirm(`Balans lan pa ase. Ou manke ${fmt(manke)}$. Depoze ${fmt(manke)}$ epi peye kazye ${k} la?`)) return;
                        balans = r2(balans + manke);
                        log('depot', { amount: manke });
                    }
                    balans = r2(balans - price);
                    paidAmt[k] = price;
                    log('kazye', { k: k, amount: price, plan: plan });
                    autoList.innerText = `Kazye ${k} peye`;
                }
                refreshAll();
                saveData();
            };

            function handleDepot() {
                const m = parseFloat(montantField.value);
                if (isNaN(m) || m <= 0) { alert('Montan valab'); return; }
                const amount = r2(m);
                balans = r2(balans + amount);
                log('depot', { amount: amount });
                const newSel = [];
                for (let k = 1; k <= 30; k++) {
                    if (!isPaid(k)) {
                        const price = r2(k * plan);
                        if (price <= balans) {
                            balans = r2(balans - price);
                            paidAmt[k] = price;
                            log('kazye', { k: k, amount: price, plan: plan, auto: true });
                            newSel.push(k);
                        } else break;
                    }
                }
                autoList.innerText = newSel.length ? newSel.join(' · ') : 'Pa gen nouvo kazye.';
                montantField.value = '';
                refreshAll();
                saveData();
            }

            function handleRetrait() {
                const m = parseFloat(montantField.value);
                if (isNaN(m) || m <= 0) { alert('Montan valab'); return; }
                const amount = r2(m);
                let released = [];
                if (amount > balans) {
                    // Balans insuffisant : on propose de libérer les dernières cases payées
                    const manke = r2(amount - balans);
                    let got = 0;
                    for (let k = 30; k >= 1 && got < manke; k--) {
                        if (isPaid(k)) { released.push(k); got = r2(got + paidAmt[k]); }
                    }
                    if (got < manke) {
                        alert(`Lajan pa ase: balans + kazye peye = ${fmt(r2(balans + sumPaid()))}$`);
                        return;
                    }
                    if (!confirm(`Balans lan pa ase (manke ${fmt(manke)}$). Pou kouvri l, kazye sa yo ap anile: ${released.join(', ')}. Kontinye?`)) return;
                    released.forEach(k => {
                        const amt = paidAmt[k];
                        balans = r2(balans + amt);
                        paidAmt[k] = 0;
                        log('anile', { k: k, amount: amt });
                    });
                }
                balans = r2(balans - amount);
                log('retrait', { amount: amount });
                autoList.innerText = released.length ? `Retrè — kazye anile: ${released.join(' · ')}` : '— Retrè senp';
                montantField.value = '';
                refreshAll();
                saveData();
            }

            function setMode(newMode) {
                mode = newMode;
                if (mode === 'depot') {
                    modeDepot.classList.add('active'); modeRetrait.classList.remove('active');
                    actionButton.innerText = '🧮 KALKILE'; actionButton.classList.remove('retrait');
                } else {
                    modeRetrait.classList.add('active'); modeDepot.classList.remove('active');
                    actionButton.innerText = '💸 RETIRE'; actionButton.classList.add('retrait');
                }
                saveData();
            }

            function clearAllPaid() {
                const total = sumPaid();
                if (total === 0) { alert('Pa gen kazye peye.'); return; }
                if (!confirm(`Efase tout kazye peye yo? ${fmt(total)}$ ap tounen nan balans lan.`)) return;
                balans = r2(balans + total);
                paidAmt.fill(0);
                log('efase', { amount: total });
                autoList.innerText = 'Tout kazye efase';
                refreshAll();
                saveData();
            }

            // Vérifie que l'état affiché correspond bien au journal ; propose de corriger sinon
            function verifyBalans() {
                const t = sumPaid();
                const rp = replay(ledger);
                const okBal = near(rp.balans, balans);
                const okCases = rp.paidAmt.every((v, i) => near(v, paidAmt[i]));
                const info = `Peye: ${fmt(t)}$ · Balans: ${fmt(balans)}$ · Total: ${fmt(r2(t + balans))}$`;
                if (okBal && okCases) {
                    alert(`✅ Tout koresponn ak istorik la.\n${info}`);
                    return;
                }
                const msg = `⚠️ Done yo pa koresponn ak istorik la.\n${info}\nIstorik la di: balans ${fmt(rp.balans)}$ · peye ${fmt(r2(rp.paidAmt.reduce((a, b) => a + b, 0)))}$\n\nKore selon istorik la?`;
                if (confirm(msg)) {
                    balans = rp.balans;
                    paidAmt = rp.paidAmt;
                    refreshAll();
                    saveData();
                }
            }

            function resetBalance() {
                if (balans === 0) { alert('Balans lan deja 0.'); return; }
                if (!confirm(`Remèt balans a 0? ${fmt(balans)}$ ap soti nan sistèm nan (anrejistre kòm ajisteman).`)) return;
                log('reset', { amount: balans });
                balans = 0;
                refreshAll();
                saveData();
            }

            // ---------- ISTORIK ----------
            const LABELS = { init: 'Solde inisyal', depot: 'DEPO', retrait: 'RETRÈ', kazye: 'KAZYE', anile: 'ANILE', efase: 'EFASE TOUT', reset: 'RESET BALANS' };
            function fmtDate(iso) {
                const d = new Date(iso);
                if (isNaN(d)) return '';
                return d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
            }
            function renderHistory() {
                let dep = 0, ret = 0, b = 0;
                const rows = [];
                ledger.forEach(e => {
                    b = r2(b + SIGN[e.type] * e.amount);
                    if (e.type === 'depot' || e.type === 'init') dep += e.amount;
                    if (e.type === 'retrait' || e.type === 'reset') ret += e.amount;
                    rows.push({ e: e, b: b });
                });
                histSummary.innerHTML =
                    `<div><span>Total depoze</span><b>${fmt(r2(dep))}$</b></div>` +
                    `<div><span>Total retire</span><b>${fmt(r2(ret))}$</b></div>` +
                    `<div><span>Nan kazye yo</span><b>${fmt(sumPaid())}$</b></div>` +
                    `<div><span>Balans</span><b>${fmt(balans)}$</b></div>`;
                lastBackupLabel.innerText = lastBackup ? `Dènye sovgad: ${fmtDate(lastBackup)}` : 'Ou poko fè okenn sovgad.';
                if (!rows.length) { histList.innerHTML = '<div class="hist-row">Poko gen tranzaksyon.</div>'; return; }
                const shown = rows.slice().reverse().slice(0, 300);
                histList.innerHTML = shown.map(({ e, b }) => {
                    const plus = SIGN[e.type] > 0;
                    let label = LABELS[e.type];
                    if (e.k) label += ` ${e.k}`;
                    if (e.type === 'kazye' && e.plan) label += ` (${e.k}×${e.plan}$)`;
                    if (e.auto) label += ' · oto';
                    return `<div class="hist-row"><div class="h-l">${label}<small>${fmtDate(e.t)}</small></div>` +
                           `<div class="h-r"><span class="${plus ? 'h-plus' : 'h-minus'}">${plus ? '+' : '−'}${fmt(e.amount)}$</span><small>balans: ${fmt(b)}$</small></div></div>`;
                }).join('') + (rows.length > shown.length ? `<div class="hist-row">… ${rows.length - shown.length} ansyen liy (yo nan sovgad la)</div>` : '');
            }

            // ---------- EXPORT / IMPORT ----------
            async function exportBackup() {
                const now = new Date().toISOString();
                const payload = { app: 'cash-shalom', v: DATA_VERSION, exportedAt: now, data: Object.assign(snapshot(), { lastBackup: now }) };
                const name = `cash-shalom-${now.slice(0, 10)}.json`;
                const file = new File([JSON.stringify(payload, null, 2)], name, { type: 'application/json' });
                let done = false;
                try {
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: 'Cash Shalom · sovgad' });
                        done = true;
                    }
                } catch (e) {
                    if (e && e.name === 'AbortError') return;   // l'utilisateur a annulé
                }
                if (!done) {
                    const url = URL.createObjectURL(file);
                    const a = document.createElement('a');
                    a.href = url; a.download = name;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                }
                lastBackup = now;
                saveData();
                refreshAll();
            }

            async function importBackup() {
                const f = importFile.files[0];
                importFile.value = '';
                if (!f) return;
                try {
                    const obj = JSON.parse(await f.text());
                    if (obj && obj.app && obj.app !== 'cash-shalom') throw new Error('app');
                    const s = normalize(obj && obj.data ? obj.data : obj);
                    if (!s) throw new Error('data');
                    if (!confirm('Ranplase tout done aktyèl yo ak sovgad sa a? (Sa pa ka defèt.)')) return;
                    applyState(s);
                    buildPlanButtons();
                    planLabel.innerText = `${plan}$`;
                    setMode(mode);
                    refreshAll();
                    saveData();
                    alert('✅ Sovgad la restore.');
                } catch (e) {
                    alert('Fichye a pa valab.');
                }
            }

            // ---------- CALCULATRICE PLEIN ÉCRAN (san eval) ----------
            let calcStr = '0';
            let calcFresh = false;      // true apre "=" oswa erè
            let angleMode = 'DEG';
            const calcDisplay = document.getElementById('calcDisplay');

            function updateCalcDisplay() {
                calcDisplay.innerText = calcStr.replace(/\*/g, '×').replace(/\//g, '÷').replace(/sqrt/g, '√');
            }
            function calcStart(c) {
                if (calcStr === 'Error') { calcStr = '0'; calcFresh = false; }
                if (calcFresh) { if (!/^[-+*\/^%!]$/.test(c)) calcStr = '0'; calcFresh = false; }
            }
            function calcFormat(v) {
                if (!isFinite(v)) throw new Error('math');
                if (Math.abs(v) < 1e-12) v = 0;
                return parseFloat(v.toPrecision(12)).toString().replace(/e\+?(-?\d+)/, '*10^$1');
            }
            function calcEval(src) {
                const bad = () => { throw new Error('syntax'); };
                const toks = [];
                let i = 0;
                while (i < src.length) {
                    const ch = src[i];
                    if (/[0-9.]/.test(ch)) {
                        let j = i;
                        while (j < src.length && /[0-9.]/.test(src[j])) j++;
                        const t = src.slice(i, j);
                        if (t === '.' || t.split('.').length > 2) bad();
                        toks.push({ n: parseFloat(t) }); i = j;
                    } else if (ch === 'π') { toks.push({ n: Math.PI }); i++; }
                    else if (ch === 'e') { toks.push({ n: Math.E }); i++; }
                    else {
                        const f = /^(sqrt|ln|log|sin|cos|tan)\(/.exec(src.slice(i));
                        if (f) { toks.push({ f: f[1] }, { o: '(' }); i += f[0].length; }
                        else if ('+-*/^()!%'.includes(ch)) { toks.push({ o: ch }); i++; }
                        else bad();
                    }
                }
                let p = 0;
                const isO = c => toks[p] && toks[p].o === c;
                const rad = x => angleMode === 'DEG' ? x * Math.PI / 180 : x;
                function applyFn(f, a) {
                    switch (f) {
                        case 'sqrt': if (a < 0) bad(); return Math.sqrt(a);
                        case 'ln':   if (a <= 0) bad(); return Math.log(a);
                        case 'log':  if (a <= 0) bad(); return Math.log10(a);
                        case 'sin':  return Math.sin(rad(a));
                        case 'cos':  return Math.cos(rad(a));
                        default:     return Math.tan(rad(a));
                    }
                }
                function fact(n) {
                    if (!Number.isInteger(n) || n < 0 || n > 170) bad();
                    let r = 1;
                    for (let k = 2; k <= n; k++) r *= k;
                    return r;
                }
                function expr() {
                    let v = term();
                    while (isO('+') || isO('-')) { const o = toks[p++].o; const r = term(); v = o === '+' ? v + r : v - r; }
                    return v;
                }
                function term() {
                    let v = unary();
                    for (;;) {
                        if (isO('*') || isO('/')) { const o = toks[p++].o; const r = unary(); v = o === '*' ? v * r : v / r; }
                        else if (toks[p] && (toks[p].n !== undefined || toks[p].f || isO('('))) v *= unary();   // 2π, 3(4)
                        else break;
                    }
                    return v;
                }
                function unary() {
                    if (isO('-')) { p++; return -unary(); }
                    if (isO('+')) { p++; return unary(); }
                    return power();
                }
                function power() {
                    const b = postfix();
                    if (isO('^')) { p++; return Math.pow(b, unary()); }
                    return b;
                }
                function postfix() {
                    let v = primary();
                    for (;;) {
                        if (isO('!')) { p++; v = fact(v); }
                        else if (isO('%')) { p++; v /= 100; }
                        else break;
                    }
                    return v;
                }
                function primary() {
                    const t = toks[p++];
                    if (!t) bad();
                    if (t.n !== undefined) return t.n;
                    if (t.f) { p++; const a = expr(); if (isO(')')) p++; return applyFn(t.f, a); }
                    if (t.o === '(') { const v = expr(); if (isO(')')) p++; return v; }
                    return bad();
                }
                const res = expr();
                if (p < toks.length) bad();
                return res;
            }

            window.calcInput = function(c) {
                calcStart(c);
                if (c === '.' && calcStr.split(/[^0-9.]/).pop().includes('.')) return;
                if (calcStr === '0' && /^[0-9πe(]$/.test(c)) calcStr = c;
                else calcStr += c;
                updateCalcDisplay();
            };
            window.calcOp = function(op) {
                calcStart(op);
                if (/[-+*\/]$/.test(calcStr)) calcStr = calcStr.slice(0, -1);
                calcStr += op;
                updateCalcDisplay();
            };
            window.calcFn = function(fn) {
                calcStart(fn === 'fact' ? '!' : fn);
                if (fn === 'fact') calcStr += '!';
                else calcStr = (calcStr === '0' ? '' : calcStr) + fn + '(';
                updateCalcDisplay();
            };
            window.calcClearAll = function() { calcStr = '0'; calcFresh = false; updateCalcDisplay(); };
            window.calcDelete = function() {
                if (calcStr === 'Error') calcStr = '0';
                else calcStr = calcStr.replace(/(sqrt|ln|log|sin|cos|tan)\($|.$/, '') || '0';
                calcFresh = false;
                updateCalcDisplay();
            };
            window.calcEquals = function() {
                try { calcStr = calcFormat(calcEval(calcStr)); }
                catch { calcStr = 'Error'; }
                calcFresh = true;
                updateCalcDisplay();
            };
            window.calcSetAngle = function(m) {
                angleMode = m;
                document.getElementById('angDeg').classList.toggle('active', m === 'DEG');
                document.getElementById('angRad').classList.toggle('active', m === 'RAD');
            };
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') calcModal.classList.remove('active'); });

            calcToggle.addEventListener('click', () => calcModal.classList.add('active'));
            closeCalc.addEventListener('click', () => calcModal.classList.remove('active'));
            calcModal.addEventListener('click', (e) => { if(e.target === calcModal) calcModal.classList.remove('active'); });

            // ---------- INITIALISATION ----------
            function init() {
                loadData();
                buildPlanButtons();
                planLabel.innerText = `${plan}$`;
                setMode(mode);
                refreshAll();
                saveData();   // persiste le journal créé lors d'une migration éventuelle

                modeDepot.addEventListener('click', ()=>setMode('depot'));
                modeRetrait.addEventListener('click', ()=>setMode('retrait'));
                actionButton.addEventListener('click', ()=> mode==='depot'? handleDepot() : handleRetrait());
                clearPaidBtn.addEventListener('click', clearAllPaid);
                verifyBtn.addEventListener('click', verifyBalans);
                resetBalanceBtn.addEventListener('click', resetBalance);

                histBtn.addEventListener('click', () => { renderHistory(); histModal.classList.add('active'); });
                closeHist.addEventListener('click', () => histModal.classList.remove('active'));
                document.addEventListener('keydown', (e) => { if (e.key === 'Escape') histModal.classList.remove('active'); });
                exportBtn.addEventListener('click', exportBackup);
                importBtn.addEventListener('click', () => importFile.click());
                importFile.addEventListener('change', importBackup);

                // Demande au navigateur de ne pas effacer les données automatiquement
                if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
            }

            init();
        })();
    </script>

    <!-- Service Worker pour PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('Service Worker enregistré avec succès');
                    })
                    .catch(err => {
                        console.log('Échec enregistrement Service Worker: ', err);
                    });
            });
        }
    </script>
</body>
